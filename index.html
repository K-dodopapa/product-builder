<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 로또 & 2026 사주</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4e73df;
            --secondary: #858796;
            --success: #1cc88a;
            --text-dark: #2d3436;
            --border-color: #edf2f7;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
            
            /* 공식 로또 공 색상 가이드 */
            --ball-yellow: #fbc400; /* 1~10 */
            --ball-blue: #69c8f2;   /* 11~20 */
            --ball-red: #ff7272;    /* 21~30 */
            --ball-gray: #aaaaaa;   /* 31~40 */
            --ball-green: #b0d840;  /* 41~45 */
        }

        body.dark-mode {
            --bg-color: #1a1c23;
            --card-bg: #242632;
            --text-dark: #f8fafc;
            --secondary: #94a3b8;
            --border-color: #333645;
            --shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
            transition: background-color 0.3s, color 0.3s;
        }

        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-dark);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            z-index: 1000;
            font-size: 1.2rem;
        }

        .dark-mode-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 2rem;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .btn-draw, .btn-saju {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
            width: 100%;
        }

        .btn-draw:hover, .btn-saju:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(118, 75, 162, 0.4);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        input[type="date"], select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-dark);
            font-family: inherit;
            box-sizing: border-box;
        }

        .saju-result {
            background: var(--bg-color);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px dashed var(--secondary);
            text-align: left;
            margin-top: 1rem;
            display: none;
            line-height: 1.6;
        }

        .saju-result h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .result-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lotto-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
            transition: background-color 0.3s, border-color 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .row-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--secondary);
            min-width: 45px;
            text-align: left;
        }

        .balls-container {
            display: flex;
            gap: 8px;
        }

        .ball {
            width: 36px;
            height: 36px;
            line-height: 36px;
            border-radius: 50%;
            font-weight: 700;
            color: white;
            font-size: 0.9rem;
            text-align: center;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.2), 2px 4px 10px rgba(0,0,0,0.1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: inline-block;
            transform: scale(0);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            from { transform: scale(0) rotate(-180deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* 번호대별 클래스 */
        .ball-10 { background-color: var(--ball-yellow); }
        .ball-20 { background-color: var(--ball-blue); }
        .ball-30 { background-color: var(--ball-red); }
        .ball-40 { background-color: var(--ball-gray); }
        .ball-max { background-color: var(--ball-green); }

        /* 모바일 대응 */
        @media (max-width: 400px) {
            .container { padding: 1.5rem; }
            .ball { width: 32px; height: 32px; line-height: 32px; font-size: 0.85rem; }
            .balls-container { gap: 5px; }
        }
    </style>
</head>
<body>

    <button class="dark-mode-toggle" onclick="toggleDarkMode()" aria-label="다크 모드 전환">
        <span id="theme-icon">🌙</span>
    </button>

    <!-- 사주 섹션 -->
    <div class="container">
        <h1>🐎 2026년 병오년 사주</h1>
        <p class="subtitle">붉은 말의 해, 당신의 신년 운세를 확인하세요</p>

        <div class="input-group">
            <label for="birthDate">생년월일</label>
            <input type="date" id="birthDate" value="1990-01-01">
        </div>

        <div class="input-group">
            <label for="birthTime">태어난 시간 (선택)</label>
            <select id="birthTime">
                <option value="unknown">모름</option>
                <option value="0">자시 (23:30 ~ 01:30)</option>
                <option value="1">축시 (01:30 ~ 03:30)</option>
                <option value="2">인시 (03:30 ~ 05:30)</option>
                <option value="3">묘시 (05:30 ~ 07:30)</option>
                <option value="4">진시 (07:30 ~ 09:30)</option>
                <option value="5">사시 (09:30 ~ 11:30)</option>
                <option value="6">오시 (11:30 ~ 13:30)</option>
                <option value="7">미시 (13:30 ~ 15:30)</option>
                <option value="8">신시 (15:30 ~ 17:30)</option>
                <option value="9">유시 (17:30 ~ 19:30)</option>
                <option value="10">술시 (19:30 ~ 21:30)</option>
                <option value="11">해시 (21:30 ~ 23:30)</option>
            </select>
        </div>

        <button class="btn-saju" onclick="calculateSaju()">운세 보기</button>

        <div id="sajuResult" class="saju-result">
            <h3 id="sajuTitle"></h3>
            <p id="sajuContent"></p>
        </div>
    </div>

    <!-- 로또 섹션 -->
    <div class="container">
        <h1>🍀 행운의 추첨기</h1>
        <p class="subtitle">오늘의 행운을 담은 5개 번호 세트</p>
        
        <button class="btn-draw" onclick="drawFiveSets()">번호 생성하기</button>

        <div id="resultContainer" class="result-section">
            <!-- 결과가 여기에 생성됩니다 -->
        </div>
    </div>

    <script>
        // 테마 설정 초기화
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-icon').innerText = '☀️';
        }

        function toggleDarkMode() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                icon.innerText = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                icon.innerText = '🌙';
            }
        }

        function calculateSaju() {
            const birthDate = document.getElementById('birthDate').value;
            if (!birthDate) {
                alert('생년월일을 입력해주세요.');
                return;
            }

            // 타임존 버그 방지: 문자열을 직접 파싱
            const [year, month, day] = birthDate.split('-').map(Number);

            const today = new Date();
            const todayYear = today.getFullYear();
            const todayMonth = today.getMonth() + 1;
            const todayDay = today.getDate();

            const results = [
                { title: "🔥 뜨거운 열정의 해", content: "2026년은 병오년으로 화(火)의 기운이 매우 강합니다. 당신의 생년월일과 조화를 이루어 새로운 도전에 적합한 시기입니다. 특히 상반기에 큰 금전운이 따를 것으로 보입니다." },
                { title: "🌊 안정을 찾는 지혜", content: "주변 환경이 급격히 변할 수 있으나 본연의 페이스를 유지하는 것이 중요합니다. 인맥을 통한 귀인의 도움이 예상되며, 가을쯤 뜻밖의 기쁜 소식이 들려올 것입니다." },
                { title: "🌳 성장의 결실을 맺는 시기", content: "지난 몇 년간 노력했던 일들이 2026년에 비로소 결실을 맺습니다. 무리한 투자보다는 현재의 위치를 공고히 하는 것이 유리합니다. 건강 관리에 유의하세요." },
                { title: "✨ 빛나는 명예와 보람", content: "자신의 능력을 널리 알리게 되는 해입니다. 승진이나 합격 등 명예로운 일이 생길 가능성이 높습니다. 자신감을 가지고 추진하던 일을 밀어붙이세요." }
            ];

            // 생년월일 + 오늘 날짜를 함께 반영해 매일 다른 결과 산출
            const index = (year + month + day + todayYear + todayMonth + todayDay) % results.length;
            const selectedResult = results[index];

            const resultDiv = document.getElementById('sajuResult');
            document.getElementById('sajuTitle').innerText = selectedResult.title;
            document.getElementById('sajuContent').innerText = selectedResult.content;

            resultDiv.style.display = 'block';
            resultDiv.style.animation = 'fadeIn 0.8s ease-out';
        }

        function getBallClass(num) {
            if (num <= 10) return 'ball-10';
            if (num <= 20) return 'ball-20';
            if (num <= 30) return 'ball-30';
            if (num <= 40) return 'ball-40';
            return 'ball-max';
        }

        function generateLottoNumbers() {
            const numbers = new Set();
            while (numbers.size < 6) {
                const num = Math.floor(Math.random() * 45) + 1;
                numbers.add(num);
            }
            return Array.from(numbers).sort((a, b) => a - b);
        }

        async function drawFiveSets() {
            const container = document.getElementById('resultContainer');
            const btn = document.querySelector('.btn-draw');
            
            btn.disabled = true;
            btn.innerText = '번호 추출 중...';
            container.innerHTML = ''; 

            for (let i = 0; i < 5; i++) {
                const nums = generateLottoNumbers();
                const row = document.createElement('div');
                row.className = 'lotto-row';
                
                let ballsHTML = `<span class="row-label">SET ${i + 1}</span>`;
                ballsHTML += '<div class="balls-container"></div>';
                row.innerHTML = ballsHTML;
                container.appendChild(row);

                const ballsContainer = row.querySelector('.balls-container');
                
                for (let j = 0; j < nums.length; j++) {
                    const n = nums[j];
                    const ball = document.createElement('span');
                    ball.className = `ball ${getBallClass(n)}`;
                    ball.innerText = n;
                    ball.style.animationDelay = `${j * 0.1}s`;
                    ballsContainer.appendChild(ball);
                    // 약간의 시차를 두고 공이 하나씩 나타나게 함
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
                
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            btn.disabled = false;
            btn.innerText = '번호 생성하기';
        }

        // 페이지 로드 시 첫 세트 자동 생성 (선택 사항)
        window.onload = drawFiveSets;
    </script>

</body>
</html>
