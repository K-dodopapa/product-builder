<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로또 추첨기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            margin-bottom: 30px;
        }

        #numbers {
            margin: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .ball {
            display: inline-block;
            width: 50px;
            height: 50px;
            line-height: 50px;
            margin: 5px;
            border-radius: 50%;
            background-color: #ffcc00;
            color: black;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎰 로또 추첨기</h1>

    <button onclick="drawLotto()">추첨하기</button>

    <div id="numbers"></div>

    <script>
        function drawLotto() {
            let numbers = [];

            while (numbers.length < 6) {
                let num = Math.floor(Math.random() * 45) + 1;

                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }

            numbers.sort((a, b) => a - b);

            let resultHTML = "";

            numbers.forEach(n => {
                resultHTML += `<span class="ball">${n}</span>`;
            });

            document.getElementById("numbers").innerHTML = resultHTML;
        }
    </script>

</body>
</html>
