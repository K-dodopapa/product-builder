<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 로또 추첨기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4e73df;
            --secondary: #858796;
            --success: #1cc88a;
            --text-dark: #2d3436;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
            
            /* 공식 로또 공 색상 가이드 */
            --ball-yellow: #fbc400; /* 1~10 */
            --ball-blue: #69c8f2;   /* 11~20 */
            --ball-red: #ff7272;    /* 21~30 */
            --ball-gray: #aaaaaa;   /* 31~40 */
            --ball-green: #b0d840;  /* 41~45 */
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .btn-draw {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
            width: 100%;
        }

        .btn-draw:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(118, 75, 162, 0.4);
        }

        .btn-draw:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .result-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lotto-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fdfdfd;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid #edf2f7;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .row-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #a0aec0;
            min-width: 45px;
            text-align: left;
        }

        .balls-container {
            display: flex;
            gap: 8px;
        }

        .ball {
            width: 36px;
            height: 36px;
            line-height: 36px;
            border-radius: 50%;
            font-weight: 700;
            color: white;
            font-size: 0.9rem;
            text-align: center;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.2), 2px 4px 10px rgba(0,0,0,0.1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: inline-block;
            transform: scale(0);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            from { transform: scale(0) rotate(-180deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* 번호대별 클래스 */
        .ball-10 { background-color: var(--ball-yellow); }
        .ball-20 { background-color: var(--ball-blue); }
        .ball-30 { background-color: var(--ball-red); }
        .ball-40 { background-color: var(--ball-gray); }
        .ball-max { background-color: var(--ball-green); }

        /* 모바일 대응 */
        @media (max-width: 400px) {
            .container { padding: 1.5rem; }
            .ball { width: 32px; height: 32px; line-height: 32px; font-size: 0.85rem; }
            .balls-container { gap: 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍀 행운의 추첨기</h1>
        <p class="subtitle">오늘의 행운을 담은 5개 번호 세트</p>
        
        <button class="btn-draw" onclick="drawFiveSets()">번호 생성하기</button>

        <div id="resultContainer" class="result-section">
            <!-- 결과가 여기에 생성됩니다 -->
        </div>
    </div>

    <script>
        function getBallClass(num) {
            if (num <= 10) return 'ball-10';
            if (num <= 20) return 'ball-20';
            if (num <= 30) return 'ball-30';
            if (num <= 40) return 'ball-40';
            return 'ball-max';
        }

        function generateLottoNumbers() {
            const numbers = new Set();
            while (numbers.size < 6) {
                const num = Math.floor(Math.random() * 45) + 1;
                numbers.add(num);
            }
            return Array.from(numbers).sort((a, b) => a - b);
        }

        async function drawFiveSets() {
            const container = document.getElementById('resultContainer');
            const btn = document.querySelector('.btn-draw');
            
            btn.disabled = true;
            btn.innerText = '번호 추출 중...';
            container.innerHTML = ''; 

            for (let i = 0; i < 5; i++) {
                const nums = generateLottoNumbers();
                const row = document.createElement('div');
                row.className = 'lotto-row';
                
                let ballsHTML = `<span class="row-label">SET ${i + 1}</span>`;
                ballsHTML += '<div class="balls-container"></div>';
                row.innerHTML = ballsHTML;
                container.appendChild(row);

                const ballsContainer = row.querySelector('.balls-container');
                
                for (let j = 0; j < nums.length; j++) {
                    const n = nums[j];
                    const ball = document.createElement('span');
                    ball.className = `ball ${getBallClass(n)}`;
                    ball.innerText = n;
                    ball.style.animationDelay = `${j * 0.1}s`;
                    ballsContainer.appendChild(ball);
                    // 약간의 시차를 두고 공이 하나씩 나타나게 함
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
                
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            btn.disabled = false;
            btn.innerText = '번호 생성하기';
        }

        // 페이지 로드 시 첫 세트 자동 생성 (선택 사항)
        window.onload = drawFiveSets;
    </script>

</body>
</html>
