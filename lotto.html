<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 로또 추첨기</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            color: var(--text-dark);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .btn-draw {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 2rem;
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .lotto-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 12px;
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ball {
            width: 36px;
            height: 36px;
            line-height: 36px;
            border-radius: 50%;
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2);
        }

        /* 번호대별 색상 지정 */
        .ball-10 { background: #f1c40f; } /* 노랑 */
        .ball-20 { background: #3498db; } /* 파랑 */
        .ball-30 { background: #e74c3c; } /* 빨강 */
        .ball-40 { background: #95a5a6; } /* 회색 */
        .ball-45 { background: #2ecc71; } /* 초록 */

        .row-label {
            align-self: center;
            font-size: 0.8rem;
            color: #999;
            font-weight: bold;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎰 로또 추첨기</h1>
        <button class="btn-draw" onclick="drawFiveSets()">행운의 5개 조합 뽑기</button>
        <div id="resultContainer"></div>
    </div>

    <script>
        function getBallClass(num) {
            if (num <= 10) return 'ball-10';
            if (num <= 20) return 'ball-20';
            if (num <= 30) return 'ball-30';
            if (num <= 40) return 'ball-40';
            return 'ball-45';
        }

        function generateNumbers() {
            const numbers = [];
            while (numbers.length < 6) {
                const num = Math.floor(Math.random() * 45) + 1;
                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }
            return numbers.sort((a, b) => a - b);
        }

        function drawFiveSets() {
            const container = document.getElementById('resultContainer');
            container.innerHTML = ''; // 초기화

            for (let i = 0; i < 5; i++) {
                const nums = generateNumbers();
                const row = document.createElement('div');
                row.className = 'lotto-row';
                row.style.animationDelay = (i * 0.1) + 's';

                let html = `<span class="row-label">${i + 1}회</span>`;
                nums.forEach(n => {
                    html += `<span class="ball ${getBallClass(n)}">${n}</span>`;
                });
                
                row.innerHTML = html;
                container.appendChild(row);
            }
        }
    </script>

</body>
</html>
